<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ondřej Matoušek</title>
    <link rel="alternate" hreflang="cs" href="/cs" />
    <link rel="alternate" hreflang="en" href="/en" />
    <script>
      // Static hosting has no server-side Accept-Language negotiation: pick the locale here.
      (function () {
        var langs = navigator.languages || [navigator.language || ""];
        var target = "/cs";
        for (var i = 0; i < langs.length; i++) {
          var l = String(langs[i]).toLowerCase().slice(0, 2);
          if (l === "cs" || l === "sk") { target = "/cs"; break; }
          if (l === "en") { target = "/en"; break; }
        }
        location.replace(target + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/cs" /></noscript>
    <style>body{background:#07080a;color:#ecedef;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#ff9d66}</style>
  </head>
  <body>
    <p><a href="/cs">Čeština</a> · <a href="/en" lang="en">English</a></p>
  </body>
</html>
